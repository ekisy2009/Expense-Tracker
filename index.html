<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Expense Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
        }

        h1, h2 {
            margin-top: 0;
            color: var(--primary-color);
        }

        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        h2 { font-size: 1.25rem; margin-bottom: 1rem; }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input, select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        .expense-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .expense-item:last-child {
            border-bottom: none;
        }

        .expense-info {
            display: flex;
            flex-direction: column;
        }

        .expense-desc {
            font-weight: 500;
        }

        .expense-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .expense-amount {
            font-weight: 600;
            color: var(--text-color);
            margin-right: 15px;
        }

        .delete-btn {
            background: none;
            color: var(--text-muted);
            padding: 5px;
            font-size: 1.2rem;
        }

        .delete-btn:hover {
            color: var(--danger);
            background: none;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Expense Tracker</h1>
        <form id="expenseForm">
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" required placeholder="e.g. Lunch">
            </div>
            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" required min="0.01" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <button type="submit">Add Expense</button>
        </form>
    </div>

    <div class="card">
        <h2>Spending Overview</h2>
        <div class="chart-container">
            <canvas id="expenseChart"></canvas>
        </div>
    </div>

    <div class="card" style="grid-column: 1 / -1;">
        <h2>Recent Expenses</h2>
        <ul class="expense-list" id="expenseList">
            <!-- Expenses will be added here -->
        </ul>
    </div>
</div>

<script>
    // State
    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
    let chartInstance = null;

    // Elements
    const form = document.getElementById('expenseForm');
    const list = document.getElementById('expenseList');
    const ctx = document.getElementById('expenseChart').getContext('2d');

    // Save to LocalStorage
    const saveExpenses = () => {
        localStorage.setItem('expenses', JSON.stringify(expenses));
        render();
    };

    // Add Expense
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const description = document.getElementById('description').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const category = document.getElementById('category').value;

        const expense = {
            id: Date.now(),
            description,
            amount,
            category,
            date: new Date().toLocaleDateString()
        };

        expenses.unshift(expense); // Add to top
        saveExpenses();
        form.reset();
    });

    // Delete Expense
    window.deleteExpense = (id) => {
        expenses = expenses.filter(e => e.id !== id);
        saveExpenses();
    };

    // Render List
    const renderList = () => {
        list.innerHTML = '';
        if (expenses.length === 0) {
            list.innerHTML = '<li style="text-align:center; color:#9ca3af; padding:20px;">No expenses yet. Add one above!</li>';
            return;
        }

        expenses.forEach(expense => {
            const item = document.createElement('li');
            item.className = 'expense-item';
            item.innerHTML = `
                <div class="expense-info">
                    <span class="expense-desc">${expense.description}</span>
                    <span class="expense-meta">${expense.category} • ${expense.date}</span>
                </div>
                <div style="display:flex; align-items:center;">
                    <span class="expense-amount">$${expense.amount.toFixed(2)}</span>
                    <button class="delete-btn" onclick="deleteExpense(${expense.id})">&times;</button>
                </div>
            `;
            list.appendChild(item);
        });
    };

    // Render Chart
    const renderChart = () => {
        const categories = { 'Food': 0, 'Transport': 0, 'Entertainment': 0, 'Other': 0 };
        expenses.forEach(e => {
            if (categories[e.category] !== undefined) {
                categories[e.category] += e.amount;
            } else {
                categories['Other'] += e.amount;
            }
        });

        const data = Object.values(categories);
        const labels = Object.keys(categories);
        const colors = ['#10b981', '#f59e0b', '#8b5cf6', '#6b7280'];

        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: colors,
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right'
                    }
                }
            }
        });
    };

    // Main Render
    const render = () => {
        renderList();
        renderChart();
    };

    // Initialize
    render();

</script>
</body>
</html>
